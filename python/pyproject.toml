[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-wallapop"
version = "0.1.0"
description = "Crawlora Wallapop API client with 5 endpoints for public listing search, categories, filters, and item details"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "wallapop", "wallapop-api", "wallapop-scraper", "wallapop-data", "wallapop-public-listing-search", "wallapop-categories", "wallapop-filters", "wallapop-item-details"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=wallapop-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=wallapop-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-wallapop"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_wallapop"]

[tool.setuptools.package-data]
"crawlora_wallapop" = ["py.typed", "*.pyi"]
